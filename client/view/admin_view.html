<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin View - Payroll & Employee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

<header class="accent-header p-3 mb-4 shadow-sm">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="h4 mb-0 fw-bold">Admin Payroll & Employee Portal</h1>

        <div class="d-flex align-items-center gap-3">
            <div class="input-group">
                <span class="input-group-text bg-white border-0"><i class="bi bi-search"></i></span>
                <input type="text" id="searchInput" class="form-control border-0 shadow-none" placeholder="Search employees...">
            </div>

            <button id="btnPayEmployee" class="btn btn-warning text-nowrap text-dark fw-semibold" data-bs-toggle="modal" data-bs-target="#payEmployeeModal">
                <i class="bi bi-cash-stack me-1"></i> Pay Employee
            </button>

            <button id="btnMyProfile" class="btn btn-info text-nowrap text-white">
                <i class="bi bi-person-bounding-box me-1"></i> My Profile
            </button>

            <button class="btn btn-dark text-nowrap" id="btnToggleCreateForm" type="button" data-bs-toggle="collapse" data-bs-target="#createEmployeeForm">
                <i class="bi bi-person-plus-fill me-1"></i> Create Employee
            </button>
        </div>
    </div>
</header>

<main class="container-fluid px-4">

=    <div class="collapse mb-4" id="createEmployeeForm">
        <div class="card card-body border-0 shadow-sm">
            <h5 class="card-title text-muted mb-3" id="formTitle">Add New Employee</h5>
            <form id="employeeForm">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="firstName" class="form-label text-muted small">First Name</label>
                        <input type="text" class="form-control" id="firstName" required>
                    </div>
                    <div class="col-md-3">
                        <label for="lastName" class="form-label text-muted small">Last Name</label>
                        <input type="text" class="form-control" id="lastName" required>
                    </div>
                    <div class="col-md-3">
                        <label for="dob" class="form-label text-muted small">Date Of Birth</label>
                        <input type="date" class="form-control" id="dob">
                    </div>
                    <div class="col-md-3">
                        <label for="email" class="form-label text-muted small">Email ID</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>

                    <div class="col-md-3" id="passwordContainer">
                        <label for="password" class="form-label text-muted small">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter initial password">
                    </div>

                    <div class="col-md-3">
                        <label for="contactNumber" class="form-label text-muted small">Contact Number</label>
                        <input type="text" class="form-control" id="contactNumber">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label text-muted small d-block">Gender</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="male" value="Male" checked>
                            <label class="form-check-label" for="male">Male</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="female" value="Female">
                            <label class="form-check-label" for="female">Female</label>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <label for="position" class="form-label text-muted small">Position / Role</label>
                        <select class="form-select" id="position" required>
                            <option value="" disabled selected>Select Position</option>
                            <option value="Admin">Admin</option>
                            <option value="Employee">Employee</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="hourlyRate" class="form-label text-muted small">Hourly Rate ($)</label>
                        <input type="number" step="0.01" class="form-control" id="hourlyRate">
                    </div>
                    <div class="col-md-3">
                        <label for="status" class="form-label text-muted small">Status</label>
                        <select class="form-select" id="status" required>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                            <option value="Terminated">Terminated</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="address" class="form-label text-muted small">Address</label>
                        <input type="text" class="form-control" id="address">
                    </div>
                </div>
                <div class="mt-3 d-flex gap-2">
                    <button type="submit" class="btn btn-secondary px-4" id="btnSubmitForm">Submit</button>
                    <button type="button" class="btn btn-outline-secondary px-4" id="btnResetForm">Reset</button>
                    <button type="button" class="btn btn-light px-4" id="btnCancelForm">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Employee Table -->
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <div class="employee-table table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Name</th>
                        <th>Email ID</th>
                        <th>Position</th>
                        <th>Hourly Rate</th>
                        <th>Status</th>
                        <th class="text-center">Edit</th>
                        <th class="text-center">Delete</th>
                    </tr>
                    </thead>
                    <tbody id="employeeTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>

<!-- Modal: Pay Employee Schedule -->
<div class="modal fade" id="payEmployeeModal" tabindex="-1" aria-labelledby="payEmployeeModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title" id="payEmployeeModalLabel"><i class="bi bi-cash-stack me-2"></i>Process / Schedule Payroll</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="payEmployeeForm">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="payrollEmpId" class="form-label fw-bold">Select Employee</label>
                        <select class="form-select" id="payrollEmpId" required></select>
                    </div>
                    <div class="mb-3">
                        <label for="payPeriodStart" class="form-label fw-bold">Pay Period Start</label>
                        <input type="date" class="form-control" id="payPeriodStart" required>
                    </div>
                    <div class="mb-3">
                        <label for="payPeriodEnd" class="form-label fw-bold">Pay Period End</label>
                        <input type="date" class="form-control" id="payPeriodEnd" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-warning">Schedule & Pay</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal: Action Confirmation -->
<div class="modal fade" id="confirmationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-primary text-white" id="confirmModalHeader">
                <h5 class="modal-title" id="confirmModalTitle">Confirm Action</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="confirmModalBody">
                Are you sure you want to proceed with this action?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="btnConfirmAction">Confirm</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/employee_management_system/client/script/admin.js"></script>

</body>
</html>
