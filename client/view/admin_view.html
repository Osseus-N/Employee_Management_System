<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin View - Payroll & Employee Management</title>
    <link rel="stylesheet" href="/employee_management_system/client/css/output.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-gray-50 text-gray-900">
<header class="bg-white px-8 py-4 shadow-sm">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold">Admin Payroll & Employee Portal</h1>
        <div class="flex items-center gap-4">
            <div class="flex items-center">
                <i class="bi bi-search mr-3 text-xl text-gray-900"></i>
                <input type="text" id="searchInput" placeholder="Search employees..." class="w-60 border-0 bg-transparent px-1 py-2 text-base outline-none focus:ring-0">
            </div>
            <div class="relative">
                <button id="payrollDropdownBtn" type="button" class="inline-flex items-center gap-2 rounded-lg bg-yellow-400 px-4 py-3 font-semibold text-gray-900 transition hover:bg-yellow-500">
                    <i class="bi bi-cash-stack"></i> Payroll <i class="bi bi-caret-down-fill text-xs"></i>
                </button>
                <div id="payrollDropdown" class="absolute right-0 z-50 mt-2 hidden w-56 rounded-lg border border-gray-200 bg-white py-2 shadow-lg">
                    <button id="btnCreateSchedule" type="button" class="flex w-full items-center gap-3 px-4 py-2.5 text-left text-sm hover:bg-gray-100"><i class="bi bi-calendar-plus"></i> Create Schedule</button>
                    <button id="btnPaySchedule" type="button" class="flex w-full items-center gap-3 px-4 py-2.5 text-left text-sm hover:bg-gray-100"><i class="bi bi-cash-stack"></i> Pay Schedule</button>
                    <button id="btnManageSchedules" type="button" class="flex w-full items-center gap-3 px-4 py-2.5 text-left text-sm hover:bg-gray-100"><i class="bi bi-calendar-check"></i> Manage Schedules</button>
                </div>
            </div>
            <button id="btnMyProfile" type="button" class="inline-flex items-center gap-2 rounded-lg bg-cyan-500 px-4 py-3 font-medium text-white transition hover:bg-cyan-600"><i class="bi bi-person-bounding-box"></i> My Profile</button>
            <button id="btnToggleCreateForm" type="button" class="inline-flex items-center gap-2 rounded-lg bg-gray-800 px-4 py-3 font-medium text-white transition hover:bg-gray-900"><i class="bi bi-person-plus-fill"></i> Create Employee</button>
        </div>
    </div>
</header>

<main class="px-7 py-6">
    <section id="createEmployeeForm" class="mb-6 hidden">
        <div class="rounded-lg bg-white p-5 shadow-sm">
            <h2 id="formTitle" class="mb-5 text-lg font-semibold text-gray-700">Add New Employee</h2>
            <form id="employeeForm">
                <div class="grid grid-cols-1 gap-4 md:grid-cols-4">
                    <div>
                        <label for="firstName" class="mb-1 block text-sm text-gray-500">First Name</label>
                        <input type="text" id="firstName" required class="w-full rounded-md border border-gray-300 px-3 py-2.5 outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500">
                    </div>
                    <div>
                        <label for="lastName" class="mb-1 block text-sm text-gray-500">Last Name</label>
                        <input type="text" id="lastName" required class="w-full rounded-md border border-gray-300 px-3 py-2.5 outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500">
                    </div>
                    <div>
                        <label for="dob" class="mb-1 block text-sm text-gray-500">Date Of Birth</label>
                        <input type="date" id="dob" class="w-full rounded-md border border-gray-300 px-3 py-2.5 outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500">
                    </div>
                    <div>
                        <label for="email" class="mb-1 block text-sm text-gray-500">Email</label>
                        <input type="email" id="email" required class="w-full rounded-md border border-gray-300 px-3 py-2.5 outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500">
                    </div>
                    <div id="passwordContainer">
                        <label for="password" class="mb-1 block text-sm text-gray-500">Password</label>
                        <input type="password" id="password" placeholder="Enter password" class="w-full rounded-md border border-gray-300 px-3 py-2.5 outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500">
                        <small id="passwordHelp" class="mt-1 block text-xs text-gray-500">Enter a password for the employee.</small>
                    </div>
                    <div>
                        <label for="contactNumber" class="mb-1 block text-sm text-gray-500">Contact Number</label>
                        <input type="text" id="contactNumber" class="w-full rounded-md border border-gray-300 px-3 py-2.5 outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500">
                    </div>
                    <div>
                        <label class="mb-2 block text-sm text-gray-500">Gender</label>
                        <div class="flex items-center gap-5">
                            <label class="flex items-center gap-2">
                                <input type="radio" name="gender" id="male" value="Male" checked class="h-4 w-4">
                                <span>Male</span>
                            </label>
                            <label class="flex items-center gap-2">
                                <input type="radio" name="gender" id="female" value="Female" class="h-4 w-4">
                                <span>Female</span>
                            </label>
                        </div>
                    </div>
                    <div>
                        <label for="position" class="mb-1 block text-sm text-gray-500">Position / Role</label>
                        <select id="position" required class="w-full rounded-md border border-gray-300 bg-white px-3 py-2.5 outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500">
                            <option value="" disabled selected>Select Position</option>
                            <option value="Admin">Admin</option>
                            <option value="Employee">Employee</option>
                        </select>
                    </div>
                    <div>
                        <label for="hourlyRate" class="mb-1 block text-sm text-gray-500">Hourly Rate (₱)</label>
                        <input type="number" step="0.01" id="hourlyRate" class="w-full rounded-md border border-gray-300 px-3 py-2.5 outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500">
                    </div>
                    <div>
                        <label for="status" class="mb-1 block text-sm text-gray-500">Status</label>
                        <select id="status" required class="w-full rounded-md border border-gray-300 bg-white px-3 py-2.5 outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500">
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                            <option value="Terminated">Terminated</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label for="address" class="mb-1 block text-sm text-gray-500">Address</label>
                        <input type="text" id="address" class="w-full rounded-md border border-gray-300 px-3 py-2.5 outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500">
                    </div>
                </div>
                <div class="mt-5 flex gap-2">
                    <button type="submit" id="btnSubmitForm" class="rounded-md bg-gray-600 px-5 py-2.5 text-white transition hover:bg-gray-700">Submit</button>
                    <button type="button" id="btnResetForm" class="rounded-md border border-gray-300 bg-white px-5 py-2.5 text-gray-700 transition hover:bg-gray-100">Reset</button>
                    <button type="button" id="btnCancelForm" class="rounded-md border border-red-300 bg-white px-5 py-2.5 text-red-600 transition hover:bg-red-50">Cancel</button>
                </div>
            </form>
        </div>
    </section>

    <section class="rounded-lg bg-white shadow-sm">
        <div class="border-b border-gray-200 px-5 py-4">
            <h2 class="text-lg font-semibold text-gray-700">Employee List</h2>
        </div>
        <div class="overflow-x-auto">
            <table class="min-w-full">
                <thead class="bg-gray-100">
                <tr>
                    <th class="px-4 py-3 text-left text-sm font-semibold">Name</th>
                    <th class="px-4 py-3 text-left text-sm font-semibold">Email</th>
                    <th class="px-4 py-3 text-left text-sm font-semibold">Position</th>
                    <th class="px-4 py-3 text-left text-sm font-semibold">Hourly Rate</th>
                    <th class="px-4 py-3 text-left text-sm font-semibold">Status</th>
                    <th class="px-4 py-3 text-center text-sm font-semibold">Edit</th>
                    <th class="px-4 py-3 text-center text-sm font-semibold">Delete</th>
                </tr>
                </thead>
                <tbody id="employeeTableBody">
                <tr>
                    <td colspan="7" class="px-6 py-6 text-center text-sm text-gray-500">Loading employees...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<div id="confirmationModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/50 px-4" aria-hidden="true">
    <div class="w-full max-w-md rounded-lg bg-white shadow-xl">
        <div class="border-b border-gray-200 px-5 py-4">
            <h2 id="confirmModalTitle" class="text-lg font-semibold text-gray-800">Confirm Action</h2>
        </div>
        <div class="px-5 py-5">
            <p id="confirmModalBody" class="text-sm text-gray-600">Are you sure?</p>
        </div>
        <div class="flex justify-end gap-2 border-t border-gray-200 px-5 py-4">
            <button type="button" id="btnCancelConfirmation" class="rounded-md border border-gray-300 px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Cancel</button>
            <button type="button" id="btnConfirmAction" class="rounded-md bg-red-600 px-4 py-2 text-sm text-white hover:bg-red-700">Confirm</button>
        </div>
    </div>
</div>

<div id="payrollModal" class="fixed inset-0 z-[90] hidden items-center justify-center bg-black/50 px-4">
    <div class="w-full max-w-lg rounded-lg bg-white shadow-xl">
        <div class="flex items-center justify-between border-b border-gray-200 px-5 py-4">
            <h2 id="payrollModalTitle" class="text-lg font-semibold text-gray-800">Payroll</h2>
            <button type="button" id="btnClosePayrollModal" class="text-xl text-gray-500 hover:text-gray-800"><i class="bi bi-x-lg"></i></button>
        </div>
        <form id="payrollForm">
            <div id="payrollFormContent" class="px-5 py-5"></div>
            <div class="flex justify-end gap-2 border-t border-gray-200 px-5 py-4">
                <button type="button" id="btnCancelPayroll" class="rounded-md border border-gray-300 px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Cancel</button>
                <button type="submit" id="btnSubmitPayroll" class="rounded-md bg-gray-700 px-4 py-2 text-sm text-white hover:bg-gray-800">Submit</button>
            </div>
        </form>
    </div>
</div>

<div id="scheduleManagerModal" class="fixed inset-0 z-[80] hidden items-center justify-center bg-black/50 px-4"
        aria-hidden="true">
    <div class="w-full max-w-4xl rounded-lg bg-white shadow-xl">

        <div class="flex items-center justify-between border-b border-gray-200 px-5 py-4">
            <h2 class="text-lg font-semibold text-gray-800">
                Payroll Schedules
            </h2>
            <button type="button" id="btnCloseScheduleManager"
                    class="text-xl text-gray-500 hover:text-gray-800"><i class="bi bi-x-lg"></i></button>
        </div>
        <div id="scheduleManagerContent" class="px-5 py-5">
        </div>
    </div>
</div>

<script src="/employee_management_system/client/script/api.js"></script>
<script src="/employee_management_system/client/script/utils.js"></script>
<script src="/employee_management_system/client/script/validation.js"></script>
<script src="/employee_management_system/client/script/admin.js"></script>
<script src="/employee_management_system/client/script/payroll.js"></script>


</body>
</html>
