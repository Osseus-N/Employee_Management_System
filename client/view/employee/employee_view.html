<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Self Service Portal</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style/style.css">

    <script src="../script/login/validation.js"></script>
    <script src="../script/attendance.js"></script>
    <script src="../script/payroll.js"></script>
    <script src="../script/employee.js" defer></script>
</head>

<body class="bg-slate-100">

<!-- Header -->
<header class="bg-slate-800 shadow-lg">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center flex-wrap gap-4">
        <div>
            <h1 class="text-3xl font-bold text-white">Employee Self Service Portal</h1>
            <p class="text-slate-300">Payroll &amp; Attendance</p>
        </div>

        <div class="flex items-center gap-4">
            <span id="welcomeGreeting" class="text-white font-semibold">Welcome</span>
            <a id="adminReturnBtn" href="../admin/admin_view.html"
               class="hidden bg-sky-500 hover:bg-sky-600 text-white px-5 py-2 rounded-xl transition">
                Admin Dashboard
            </a>
            <button onclick="logout()"
                    class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-xl transition">
                Logout
            </button>
        </div>
    </div>
</header>

<!-- Main -->
<main class="max-w-7xl mx-auto p-6">

    <div class="grid lg:grid-cols-3 gap-8">

        <!-- Profile -->
        <div class="lg:col-span-1">
            <div class="bg-white rounded-2xl shadow-xl p-8">
                <h2 class="text-2xl font-bold text-slate-700 mb-6">My Profile</h2>

                <form id="profileForm">
                    <div class="space-y-5">
                        <div>
                            <label for="empFirstName" class="block text-sm font-medium text-gray-700 mb-2">First Name</label>
                            <input type="text" id="empFirstName" required
                                   class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500">
                        </div>

                        <div>
                            <label for="empLastName" class="block text-sm font-medium text-gray-700 mb-2">Last Name</label>
                            <input type="text" id="empLastName" required
                                   class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500">
                        </div>

                        <div>
                            <label for="empContact" class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
                            <input type="text" id="empContact" maxlength="11"
                                   class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500">
                        </div>

                        <div class="grid grid-cols-2 gap-4 text-sm text-gray-600 pt-2 border-t">
                            <div>
                                <p class="text-gray-400">Position</p>
                                <p id="empPosition" class="font-medium text-slate-700">—</p>
                            </div>
                            <div>
                                <p class="text-gray-400">Status</p>
                                <p id="empStatus" class="font-medium text-slate-700">—</p>
                            </div>
                        </div>

                        <button type="submit"
                                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Right Side -->
        <div class="lg:col-span-2 space-y-8">

            <!-- Attendance Card -->
            <div class="bg-white rounded-2xl shadow-xl p-8">
                <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-700">Attendance Log</h2>
                        <p class="text-gray-500 text-sm">Track your daily attendance</p>
                    </div>
                    <div class="flex gap-3">
                        <button id="btnMarkPresent"
                                class="bg-green-600 hover:bg-green-700 text-white px-5 py-3 rounded-xl font-semibold transition">
                            Clock In
                        </button>
                        <button id="btnClockOut"
                                class="bg-slate-600 hover:bg-slate-700 text-white px-5 py-3 rounded-xl font-semibold transition">
                            Clock Out
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto rounded-xl border border-gray-200">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-slate-800 text-white">
                        <tr>
                            <th class="px-4 py-3 text-left">Date</th>
                            <th class="px-4 py-3 text-left">Clock In</th>
                            <th class="px-4 py-3 text-left">Clock Out</th>
                            <th class="px-4 py-3 text-left">Hours</th>
                        </tr>
                        </thead>
                        <tbody id="attendanceTableBody" class="divide-y divide-gray-200">
                        <tr><td colspan="4" class="text-center py-6 text-gray-400">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Payroll Card -->
            <div class="bg-white rounded-2xl shadow-xl p-8">
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-slate-700">Payroll History</h2>
                    <p class="text-gray-500 text-sm">View your salary records</p>
                </div>

                <div class="overflow-x-auto rounded-xl border border-gray-200">
                    <table class="min-w-full">
                        <thead class="bg-slate-800 text-white">
                        <tr>
                            <th class="px-5 py-3 text-left">Pay Period</th>
                            <th class="px-5 py-3 text-left">Hours Worked</th>
                            <th class="px-5 py-3 text-left">Amount</th>
                            <th class="px-5 py-3 text-left">Status</th>
                        </tr>
                        </thead>
                        <tbody id="payrollTableBody" class="divide-y divide-gray-200">
                        <tr><td colspan="4" class="text-center py-6 text-gray-400">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

</main>

</body>
</html>
