<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Portal - Self Service</title>
    <link rel="stylesheet" href="/employee_management_system/client/css/output.css">
    <link rel="stylesheet" href="/employee_management_system/client/css/employee-calendar.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen">

<header class="bg-white px-4 py-4 mb-6 shadow-sm border-b border-gray-200">
    <div class="w-full flex justify-between items-center">

        <!-- Title -->
        <h1 class="text-2xl font-bold text-gray-900">
            Employee Self-Service Portal
        </h1>

        <div class="flex items-center gap-4">
            <span class="font-semibold text-gray-900" id="welcomeGreeting"></span>

            <a href="/employee_management_system/admin"
               id="adminReturnBtn"
               class="hidden inline-flex items-center px-3 py-2 text-sm font-medium text-white bg-gray-800 border border-gray-800 rounded-md hover:bg-gray-900 transition-colors">
                <i class="bi bi-speedometer2 mr-1"></i>
                Admin Dashboard
            </a>

            <button id="btnLogout"
                    type="button"
                    class="inline-flex items-center px-3 py-2 text-sm font-medium text-red-600 bg-white border border-red-500 rounded-md hover:bg-red-50 transition-colors">
                <i class="bi bi-box-arrow-right mr-1"></i>
                Logout
            </button>
        </div>

    </div>
</header>


<div id="logoutModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/50 px-4">
    <div class="w-full max-w-md bg-white rounded-lg shadow-xl">

        <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200">
            <h5 class="text-lg font-semibold text-gray-900">
                Confirm Logout
            </h5>
            <button type="button"
                    id="closeLogoutModal"
                    class="text-gray-400 hover:text-gray-600 text-2xl leading-none">
                &times;
            </button>
        </div>

        <div class="px-5 py-5">
            <p class="text-gray-700">
                Are you sure you want to log out?
            </p>
        </div>

        <div class="flex justify-end gap-3 px-5 py-4 border-t border-gray-200">
            <button type="button"
                    id="cancelLogoutBtn"
                    class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 border border-gray-300 rounded-md hover:bg-gray-200">
                Cancel
            </button>

            <button type="button"
                    id="confirmLogoutBtn"
                    class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-md hover:bg-red-700">
                Logout
            </button>
        </div>

    </div>
</div>

<main class="w-full px-4 lg:px-7">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">


        <div class="lg:col-span-4">
            <div class="bg-white rounded-lg shadow-sm border border-gray-100">

                <div class="px-5 pt-5 flex justify-between items-center">
                    <h5 class="text-xl text-gray-700 font-medium">
                        <i class="bi bi-person-lines-fill mr-2"></i>
                        My Profile
                    </h5>
                    <small class="text-gray-500">Edit details if inaccurate</small>
                </div>

                <div class="p-5">
                    <form id="profileForm">

                        <div class="mb-5">
                            <label for="empFirstName" class="block mb-2 text-sm text-gray-600">
                                First Name
                            </label>
                            <input type="text"
                                   id="empFirstName"
                                   required
                                   class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400">
                        </div>

                        <div class="mb-5">
                            <label for="empLastName" class="block mb-2 text-sm text-gray-600">
                                Last Name
                            </label>
                            <input type="text"
                                   id="empLastName"
                                   required
                                   class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400">
                        </div>

                        <div class="mb-5">
                            <label for="empEmail" class="block mb-2 text-sm text-gray-600">
                                Email Address
                            </label>
                            <input type="email"
                                   id="empEmail"
                                   required
                                   class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400">
                        </div>

                        <div class="mb-5">
                            <label for="empPhone" class="block mb-2 text-sm text-gray-600">
                                Phone Number
                            </label>
                            <input type="text"
                                   id="empPhone"
                                   class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400">
                        </div>

                        <div class="mb-5">
                            <label for="empAddress" class="block mb-2 text-sm text-gray-600">
                                Home Address
                            </label>
                            <textarea id="empAddress"
                                      rows="2"
                                      class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-gray-900 resize-y focus:outline-none focus:ring-1 focus:ring-gray-400 focus:border-gray-400"></textarea>
                        </div>

                        <button type="submit"
                                class="w-full py-2.5 text-gray-900 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                            Save Changes
                        </button>

                    </form>
                </div>

            </div>
        </div>

        <div class="lg:col-span-8">

            <div class="bg-white rounded-lg shadow-sm border border-gray-100 mb-6">

                <div class="px-5 pt-5 flex justify-between items-center">
                    <h5 class="text-xl text-gray-700 font-medium">
                        <i class="bi bi-calendar-check mr-2"></i>
                        Attendance Log
                    </h5>

                    <button id="btnMarkPresent"
                            class="inline-flex items-center px-3 py-2 text-sm font-medium text-white bg-green-600 rounded-md hover:bg-green-700 transition-colors">
                        <i class="bi bi-check-circle mr-1"></i>
                        Mark Present
                    </button>
                </div>

                <div class="p-5">
                    <div id="attendanceCalendar"></div>

                    <div class="flex items-center gap-2 mt-4 text-sm text-gray-500 flex-wrap">
                        <span>Legend:</span>
                        <span class="w-8 h-8 rounded-md bg-green-600"></span>
                        <span>Present</span>
                        <span class="w-8 h-8 rounded-md bg-red-500 ml-1"></span>
                        <span>Absent</span>
                        <span class="w-8 h-8 rounded-md bg-yellow-500 ml-1"></span>
                        <span>Weekend / Non-working</span>
                    </div>
                </div>

            </div>

            <div class="bg-white rounded-lg shadow-sm border border-gray-100">

                <!-- Header -->
                <div class="px-5 pt-5">
                    <h5 class="text-xl text-gray-700 font-medium">
                        <i class="bi bi-receipt mr-2"></i>
                        Payroll History
                    </h5>
                </div>

                <div class="p-5">
                    <div class="w-full overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                            <tr class="border-b border-gray-300">
                                <th class="px-3 py-3 font-semibold text-gray-900">
                                    Pay Period
                                </th>
                                <th class="px-3 py-3 font-semibold text-gray-900">
                                    Total Days
                                </th>
                                <th class="px-3 py-3 font-semibold text-gray-900">
                                    Amount
                                </th>
                                <th class="px-3 py-3 font-semibold text-gray-900">
                                    Status
                                </th>
                            </tr>
                            </thead>
                            <tbody id="payrollTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

        </div>

    </div>
</main>

<script src="/employee_management_system/client/script/api.js"></script>
<script src="/employee_management_system/client/script/validation.js"></script>
<script src="/employee_management_system/client/script/employee.js"></script>
<script src="/employee_management_system/client/script/attendance.js"></script>
<script src="/employee_management_system/client/script/logout.js"></script>

</body>
</html>
