<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Portal - Self Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="employee-style.css" rel="stylesheet">
    <script src="../script/validation.js"></script>
    <script src="../script/admin.js"></script>
</head>
<body>

<header class="accent-header p-3 mb-4 shadow-sm">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h1 class="h4 mb-0 fw-bold">Employee Self-Service Portal</h1>

        <div class="d-flex align-items-center gap-3">

            <a href="/employee_management_system/admin" id="adminReturnBtn" class="btn btn-dark btn-sm" >
                <i class="bi bi-speedometer2 me-1"></i> Admin Dashboard
            </a>

            <span class="fw-semibold" id="welcomeGreeting"></span>

            <button id="btnLogout" class="btn btn-outline-danger btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
            <div class="modal fade" id="logoutModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Confirm Logout</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            Are you sure you want to log out?
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="button" class="btn btn-danger" id="confirmLogoutBtn">Logout</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</header>

<main class="container-fluid px-4">
    <div class="row g-4">

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-0 pt-3 d-flex justify-content-between align-items-center">
                    <h5 class="card-title text-muted mb-0"><i class="bi bi-person-lines-fill me-2"></i> My Profile</h5>
                    <small class="text-muted">Edit details if inaccurate</small>
                </div>
                <div class="card-body">
                    <form id="profileForm">
                        <div class="mb-3">
                            <label for="empFirstName" class="form-label text-muted small">First Name</label>
                            <input type="text" class="form-control" id="empFirstName" required>
                        </div>
                        <div class="mb-3">
                            <label for="empLastName" class="form-label text-muted small">Last Name</label>
                            <input type="text" class="form-control" id="empLastName" required>
                        </div>
                        <div class="mb-3">
                            <label for="empEmail" class="form-label text-muted small">Email Address</label>
                            <input type="email" class="form-control" id="empEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="empPhone" class="form-label text-muted small">Phone Number</label>
                            <input type="text" class="form-control" id="empPhone">
                        </div>
                        <div class="mb-3">
                            <label for="empAddress" class="form-label text-muted small">Home Address</label>
                            <textarea class="form-control" id="empAddress" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn btn-accent w-100">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-white border-0 pt-3 d-flex justify-content-between align-items-center">
                    <h5 class="card-title text-muted mb-0">
                        <i class="bi bi-calendar-check me-2"></i> Attendance Log
                    </h5>
                    <div>
                        <button class="btn btn-success btn-sm" id="btnMarkPresent">
                            <i class="bi bi-check-circle me-1"></i> Mark Present
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div id="attendanceCalendar" class="attendance-calendar"></div>
                    <div class="d-flex align-items-center gap-2 mt-3 small text-muted">
                        <span>Legend:</span>
                        <span class="attendance-cell present"></span> Present
                        <span class="attendance-cell absent"></span> Absent
                        <span class="attendance-cell weekend"></span> Weekend / Non-working
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-0 pt-3">
                    <h5 class="card-title text-muted mb-0"><i class="bi bi-receipt me-2"></i> Payroll History</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                            <tr>
                                <th>Pay Period</th>
                                <th>Hours Worked</th>
                                <th>Gross Pay</th>
                                <th>Net Pay</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                            <tbody id="payrollTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/employee_management_system/client/script/employee.js"></script>
<script src="/employee_management_system/client/script/logout.js"></script>
<script src="/employee_management_system/client/script/validation.js"></script>

</body>
</html>
