<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System | Login</title>
    <link rel="stylesheet" href="/employee_management_system/client/css/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body class="bg-gray-100">
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <div class="bg-white border border-gray-300 rounded-lg shadow-lg">
            <div class="p-6 sm:p-8">
                <div class="text-center mb-6">
                    <i class="fas fa-user-circle text-6xl text-gray-500"></i>
                    <h2 class="mt-4 text-3xl font-semibold text-gray-900">Employee Management System</h2>
                    <p class="mt-2 text-gray-500">Login to continue</p>
                </div>

                <form id="loginForm" action="/employee_management_system/login" method="POST">
                    <div class="mb-4">
                        <label for="emailInput" class="block mb-2 text-base text-gray-900">Email</label>
                        <input type="email" id="emailInput" placeholder="Enter email" required class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-gray-500 focus:border-gray-500">
                    </div>

                    <div class="mb-4">
                        <label for="passwordInput" class="block mb-2 text-base text-gray-900">Password</label>
                        <div class="flex">
                            <input type="password" id="passwordInput" placeholder="Enter password" required class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-l-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-gray-500 focus:border-gray-500">
                            <button type="button" id="togglePassword" class="w-14 border border-gray-500 border-l-0 rounded-r-lg bg-white text-gray-500 hover:bg-gray-100 focus:outline-none focus:ring-1 focus:ring-gray-500">
                                <i class="fas fa-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center mb-4">
                        <input type="checkbox" id="rememberCheck" class="w-5 h-5 border-gray-300 rounded text-gray-700 focus:ring-gray-500">
                        <label for="rememberCheck" class="ml-2 text-base text-gray-900">Remember Me</label>
                    </div>

                    <button type="submit" id="btnLogin" class="w-full py-2.5 bg-gray-800 hover:bg-gray-900 text-white font-medium rounded-lg transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2">
                        <i class="fas fa-sign-in-alt mr-1"></i> Login
                    </button>
                </form>

                <div id="loginMessage" class="mt-4 text-center text-red-600"></div>
            </div>
        </div>
    </div>
</div>

<script src="/employee_management_system/client/script/api.js"></script>
<script src="/employee_management_system/client/script/validation.js"></script>
<script src="/employee_management_system/client/script/login/authen.js"></script>
<script src="/employee_management_system/client/script/login/password.js"></script>
</body>
</html>
