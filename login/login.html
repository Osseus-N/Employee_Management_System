<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System | Login</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Font Awesome -->
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center vh-100">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-circle fa-4x text-secondary"></i>
                        <h2 class="mt-3">
                            Employee Management System
                        </h2>
                        <p class="text-muted">
                            Login to continue
                        </p>
                    </div>

                    <form id="loginForm" onsubmit="alert('FORM SUBMITTED'); return false;">
                        <div class="mb-3">

                            <label class="form-label">Email</label>
                            <input type="email" id="emailInput" class="form-control" placeholder="Enter email" required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Password</label>
                            <input type="password" id="passwordInput" class="form-control" placeholder="Enter password" required>

                        </div>

                        <div class="form-check mb-3">

                            <input class="form-check-input" type="checkbox" id="rememberCheck">
                            <label class="form-check-label" for="rememberCheck">Remember Me</label>

                        </div>

                        <button type="submit" class="btn btn-dark w-100" id="btnLogin">
                            <i class="fas fa-sign-in-alt"></i>Login
                        </button>

                    </form>

                    <div id="loginMessage" class="mt-3 text-center text-danger"></div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="../client/view/script/login/validation.js"></script>
<script src="../client/view/script/login/authen.js"></script>
</body>

</html>
