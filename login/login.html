<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-4 col-md-6 col-sm-8 col-12">
            <!-- Added shadow-lg for prominent form shadow -->
            <div class="card shadow-lg p-4 p-lg-5 border-0">

                <div class="text-center mb-4">
                    <i class="fas fa-lock fa-4x text-secondary"></i>
                </div>
                <h1 class="text-center fw-bold display-6 text-dark">Welcome Back</h1>
                <p class="text-center text-muted mb-4">Sign in to your account</p>

                <form id="loginForm" novalidate>
                    <div class="mb-4">
                        <label for="emailInput" class="form-label text-dark">Email or Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-user"></i></span>
                            <input type="email" class="form-control form-control-lg" id="emailInput" placeholder="you@example.com" required>
                            <div class="invalid-feedback">Please enter a valid email.</div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="passwordInput" class="form-label text-dark">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control form-control-lg" id="passwordInput" placeholder="••••••••" required minlength="6">
                            <div class="invalid-feedback">Password must be at least 6 characters.</div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberCheck" />
                            <label class="form-check-label text-dark" for="rememberCheck">Remember me</label>
                        </div>
                        <a href="#" class="link-dark text-decoration-underline">Forgot password?</a>
                    </div>

                    <!-- Dark gray button -->
                    <button type="submit" class="btn btn-dark btn-lg w-100 py-2 fw-semibold">
                        <i class="fas fa-sign-in-alt me-2"></i> Sign In
                    </button>
                </form>

                <p class="text-center mt-4 mb-0 text-muted">
                    Don't have an account? <a href="signup.html" class="text-primary fw-semibold">Sign up</a>
                </p>
            </div>
        </div>
    </div>
</div>

<!-- External JavaScript -->
<script src="auth.js"></script>
</body>
</html>
