<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Employee Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">

<div class="bg-white rounded-2xl shadow-xl p-10 w-full max-w-md">
    <h1 class="text-2xl font-bold text-slate-800 mb-1">Employee Management System</h1>
    <p class="text-gray-500 mb-8">Sign in to continue</p>

    <form id="loginForm" class="space-y-5">
        <div>
            <label for="emailInput" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
            <input id="emailInput" type="email" required autocomplete="username"
                   placeholder="you@email.com"
                   class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label for="passwordInput" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
            <input id="passwordInput" type="password" required autocomplete="current-password"
                   placeholder="••••••••"
                   class="w-full rounded-xl border border-gray-300 bg-gray-50 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <p id="loginError" class="hidden text-sm text-red-600"></p>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition">
            Sign In
        </button>
    </form>
</div>

<script src="../client/view/script/login/validation.js"></script>
<script src="../client/view/script/login/authen.js" defer></script>
</body>
</html>
