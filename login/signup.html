<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-dark">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-9 col-12">
            <div class="card bg-secondary bg-opacity-10 border-0 shadow-lg p-4 p-lg-5">

                <!-- Header -->
                <div class="text-center mb-4">
                    <i class="fas fa-user-plus fa-4x text-primary"></i>
                </div>
                <h1 class="text-center text-white fw-bold display-6">Create Account</h1>
                <p class="text-center text-white-50 mb-4">Join us – choose your role to get started</p>

                <!-- Signup Form -->
                <form id="signupForm" novalidate>
                    <!-- Full Name -->
                    <div class="mb-4">
                        <label for="fullNameInput" class="form-label text-white-50 fs-6">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-secondary text-white-50"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control form-control-lg bg-transparent text-white border-secondary" id="fullNameInput" placeholder="John Doe" required>
                            <div class="invalid-feedback">Please enter your full name.</div>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="mb-4">
                        <label for="emailInput" class="form-label text-white-50 fs-6">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-secondary text-white-50"><i class="fas fa-envelope"></i></span>
                            <input type="email" class="form-control form-control-lg bg-transparent text-white border-secondary" id="emailInput" placeholder="you@example.com" required>
                            <div class="invalid-feedback">Please enter a valid email.</div>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="mb-4">
                        <label for="passwordInput" class="form-label text-white-50 fs-6">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-secondary text-white-50"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control form-control-lg bg-transparent text-white border-secondary" id="passwordInput" placeholder="Min 6 characters" required minlength="6">
                            <div class="invalid-feedback">Password must be at least 6 characters.</div>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-4">
                        <label for="confirmPasswordInput" class="form-label text-white-50 fs-6">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-secondary text-white-50"><i class="fas fa-check"></i></span>
                            <input type="password" class="form-control form-control-lg bg-transparent text-white border-secondary" id="confirmPasswordInput" placeholder="Re‑enter password" required>
                            <div class="invalid-feedback">Passwords do not match.</div>
                        </div>
                        <div id="passwordMatchFeedback" class="text-danger small mt-1" style="display: none;">
                            <i class="fas fa-exclamation-circle me-1"></i> Passwords do not match.
                        </div>
                    </div>

                    <!-- Role Selection -->
                    <div class="mb-4">
                        <label class="form-label text-white-50 d-block fs-6">I want to join as</label>
                        <div class="d-flex gap-3" role="group" aria-label="Role selection">
                            <input type="radio" class="btn-check" name="role" id="roleEmployee" value="Employee" checked />
                            <label class="btn btn-outline-primary btn-lg w-100" for="roleEmployee"><i class="fas fa-user me-1"></i> Employee</label>
                            <input type="radio" class="btn-check" name="role" id="roleAdmin" value="Admin" />
                            <label class="btn btn-outline-primary btn-lg w-100" for="roleAdmin"><i class="fas fa-user-cog me-1"></i> Admin</label>
                        </div>
                    </div>

                    <!-- Terms -->
                    <div class="mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="termsCheck" required />
                            <label class="form-check-label text-white-50" for="termsCheck">
                                I agree to the <a href="#" class="text-primary">Terms of Service</a> and <a href="#" class="text-primary">Privacy Policy</a>
                            </label>
                            <div class="invalid-feedback">You must agree to the terms.</div>
                        </div>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn btn-primary btn-lg w-100 py-2 fw-semibold">
                        <i class="fas fa-user-plus me-2"></i> Create Account
                    </button>
                </form>

                <!-- Login Link -->
                <p class="text-center mt-4 mb-0 text-white-50">
                    Already have an account? <a href="login.html" class="text-primary fw-semibold">Log in</a>
                </p>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Validation Script -->
<script>
    (function() {
        'use strict';
        const form = document.getElementById('signupForm');
        const password = document.getElementById('passwordInput');
        const confirmPassword = document.getElementById('confirmPasswordInput');
        const matchFeedback = document.getElementById('passwordMatchFeedback');

        function passwordsMatch() {
            return password.value === confirmPassword.value && password.value.length > 0 && confirmPassword.value.length > 0;
        }

        function updateMatchFeedback() {
            if (confirmPassword.value.length === 0) {
                matchFeedback.style.display = 'none';
                confirmPassword.classList.remove('is-invalid');
                return;
            }
            if (passwordsMatch()) {
                matchFeedback.style.display = 'none';
                confirmPassword.classList.remove('is-invalid');
            } else {
                matchFeedback.style.display = 'block';
                confirmPassword.classList.add('is-invalid');
            }
        }

        password.addEventListener('input', updateMatchFeedback);
        confirmPassword.addEventListener('input', updateMatchFeedback);

        form.addEventListener('submit', function(event) {
            event.preventDefault();
            event.stopPropagation();
            updateMatchFeedback();

            const terms = document.getElementById('termsCheck');
            if (!terms.checked) {
                terms.classList.add('is-invalid');
            } else {
                terms.classList.remove('is-invalid');
            }

            const selectedRole = document.querySelector('input[name="role"]:checked');
            const isFormValid = form.checkValidity() && passwordsMatch() && terms.checked;

            if (isFormValid && selectedRole) {
                alert('✅ Account created as ' + selectedRole.value + '! (Demo)');
                form.reset();
                form.classList.remove('was-validated');
                matchFeedback.style.display = 'none';
                form.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
                document.getElementById('roleEmployee').checked = true;
                return;
            }
            form.classList.add('was-validated');
            if (!passwordsMatch() && confirmPassword.value.length > 0) {
                matchFeedback.style.display = 'block';
            }
        }, false);
    })();
</script>
</body>
</html>
