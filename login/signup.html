<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-9 col-12">
            <!-- Added shadow-lg for prominent form shadow -->
            <div class="card shadow-lg p-4 p-lg-5 border-0">

                <div class="text-center mb-4">
                    <i class="fas fa-user-plus fa-4x text-secondary"></i>
                </div>
                <h1 class="text-center fw-bold display-6 text-dark">Create Account</h1>
                <p class="text-center text-muted mb-4">Join us – choose your role to get started</p>

                <form id="signupForm" novalidate>
                    <!-- Full Name -->
                    <div class="mb-4">
                        <label for="fullNameInput" class="form-label text-dark">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control form-control-lg" id="fullNameInput" placeholder="John Doe" required>
                            <div class="invalid-feedback">Please enter your full name.</div>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="mb-4">
                        <label for="emailInput" class="form-label text-dark">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-envelope"></i></span>
                            <input type="email" class="form-control form-control-lg" id="emailInput" placeholder="you@example.com" required>
                            <div class="invalid-feedback">Please enter a valid email.</div>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="mb-4">
                        <label for="passwordInput" class="form-label text-dark">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control form-control-lg" id="passwordInput" placeholder="Min 6 characters" required minlength="6">
                            <div class="invalid-feedback">Password must be at least 6 characters.</div>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-4">
                        <label for="confirmPasswordInput" class="form-label text-dark">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-check"></i></span>
                            <input type="password" class="form-control form-control-lg" id="confirmPasswordInput" placeholder="Re‑enter password" required>
                            <div class="invalid-feedback">Passwords do not match.</div>
                        </div>
                        <div id="passwordMatchFeedback" class="text-danger small mt-1" style="display: none;">
                            <i class="fas fa-exclamation-circle me-1"></i> Passwords do not match.
                        </div>
                    </div>

                    <!-- Role Selection -->
                    <div class="mb-4">
                        <label class="form-label text-dark d-block">I want to join as</label>
                        <div class="d-flex gap-3" role="group" aria-label="Role selection">
                            <input type="radio" class="btn-check" name="role" id="roleEmployee" value="Employee" checked />
                            <!-- Dark gray outline button -->
                            <label class="btn btn-outline-dark btn-lg w-100" for="roleEmployee"><i class="fas fa-user me-1"></i> Employee</label>
                            <input type="radio" class="btn-check" name="role" id="roleAdmin" value="Admin" />
                            <!-- Dark gray outline button -->
                            <label class="btn btn-outline-dark btn-lg w-100" for="roleAdmin"><i class="fas fa-user-cog me-1"></i> Admin</label>
                        </div>
                    </div>

                    <!-- Terms -->
                    <div class="mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="termsCheck" required />
                            <label class="form-check-label text-dark" for="termsCheck">
                                I agree to the <a href="#" class="link-dark text-decoration-underline">Terms of Service</a> and <a href="#" class="link-dark text-decoration-underline">Privacy Policy</a>
                            </label>
                            <div class="invalid-feedback">You must agree to the terms.</div>
                        </div>
                    </div>

                    <!-- Dark gray button -->
                    <button type="submit" class="btn btn-dark btn-lg w-100 py-2 fw-semibold">
                        <i class="fas fa-user-plus me-2"></i> Create Account
                    </button>
                </form>

                <p class="text-center mt-4 mb-0 text-muted">
                    Already have an account? <a href="login.html" class="text-primary fw-semibold">Log in</a>
                </p>
            </div>
        </div>
    </div>
</div>

<!-- External JavaScript -->
<script src="auth.js"></script>
</body>
</html>
